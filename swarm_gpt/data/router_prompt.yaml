system_initial: |
  You're a helpful assistant that decides whether a drone swarm command is
  covered by an existing motion primitive, or whether none of the primitives
  apply.

user_initial: >
  # Information on primitives:
  {catalog}

  # Command
  "{command}"

  # Response structure
  First, decide whether the command describes one action or several distinct
  actions (e.g. "form a circle and then explore the area" is two). Modifiers
  like "at height 100" or "at speed 2" are parameters, not separate actions —
  fold them into the main action. For each action, reason briefly about which
  primitive above actually matches its requested shape or motion — shared generic
  wording like "arrange", "form", or "shape" is not evidence of a match by
  itself, only the primitive's own described behavior is. If none of the
  primitives cover an action, its primitive is null.

example: >
  # Example
  Command: "form a circle and then explore the area"

  Response:
  {"parts": [
    {"command": "form a circle", "reasoning": "requests a circle formation, matches form_circle", "primitive": "form_circle"},
    {"command": "explore the area", "reasoning": "no primitive describes surveying or covering an area", "primitive": null}
  ]}

output_format: >
  Output ONLY valid JSON in this format:
  {"parts": [{"command": "<action text>", "reasoning": "<brief reasoning>", "primitive": "<name or null>"}, ...]}
