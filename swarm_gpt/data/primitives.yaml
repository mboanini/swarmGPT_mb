move:
  description: Moves drones to absolute position
  n_args: 4
move_z:
  description: Moves drones along the z axis by a distance; positive moves them up,
    negative moves them down.
  n_args: 2
rotate:
  description: Rotates all drones by an angle along an axis.
  n_args: 2
form_circle:
  description: Arranges drones into a circle formation at a given height; the radius
    is decided by the number of drones in the list — a bigger circle for more drones.
  n_args: 2
center:
  description: Calculates the geometric center of the given drones' current positions
    and moves all of them to that calculated center position.
  n_args: 1
swap:
  description: Swaps positions of two drones
  n_args: 2
form_star:
  description: Creates a star in the z-plane, defined by two concentric circles in
    staggered angles with different radii, at a given height.
  n_args: 3
form_cone:
  description: Creates a cone using concentric circles of different radii stacked
    at increasing height, with each layer adding more drones. Can optionally be inverted,
    which is more expressive and dynamic.
  n_args: 3
polygon:
  description: Arranges drones in a regular polygon such as triangle, square, pentagon,
    hexagon
  n_args: 2
spiral:
  description: Makes all drones move in an outward spiral pattern with the radius
    calculated from the number of drones, over a number of steps at a given height.
  n_args: 2
spiral_speed:
  description: Has the same effect as spiral, but increases the spiral's radius over
    the number of steps. Speed defines the angle by which drones rotate around the
    center — lower speeds result in slower motion.
  n_args: 4
helix:
  description: Makes all drones move in a helix pattern, rising up with each step
    while orbiting around the center at a radius calculated from the number of drones.
  n_args: 3
twister:
  description: Makes all drones move into an upside-down cone pattern and rotate at
    a specified speed for a number of steps. A smaller spacing between neighboring
    drones makes a more compact cone.
  n_args: 3
zig_zag:
  description: Moves all drones in a zigzag pattern, with a horizontal displacement
    per step and a vertical displacement per step.
  n_args: 3
wave:
  description: Moves all drones in a three-dimensional wave propagating through a
    two-dimensional elastic surface with bounded edges; the disturbance at each point
    is governed by the wave equation.
  n_args: 5